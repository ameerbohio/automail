# Local k3d overlay -- the environment infra/k8s/k3d-cluster.yaml creates.
# Spec: plans/16-kubernetes.md §3.
#
# What belongs here and not in the base: anything that is true of *this host*
# rather than of the system. Today that is the data tier's node pinning and
# the browser-facing origin; K3/K4 add NodePorts and the non-443 edge ports
# this host is forced onto (§8.1). A future overlays/proxmox/ carries the same
# base with real hostnames and sizes -- base+overlay is the whole point, so
# environment drift is a diff rather than a fork.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: automail

resources:
  - ../../base

# Image tags are pinned here rather than in the base so the proxmox overlay can
# point at a registry without touching shared files. Never :latest -- see
# scripts/k8s/images.sh.
images:
  - name: automail/cloud-server
    newTag: dev
  - name: automail/portal
    newTag: dev

configMapGenerator:
  # Non-secret, environment-shaped config. Generated (not a checked-in
  # ConfigMap manifest) so Kustomize appends a content hash to the name and
  # rewrites the references in the pod spec -- changing a value therefore
  # rolls the pods instead of leaving them running the old value forever.
  - name: automail-config
    literals:
      # Origin MinIO accepts the guest's cross-origin ciphertext PUT from.
      # Matches MINIO_CORS_ORIGIN in .env.example today. K4 owns the port
      # question: this host publishes the edge on 9443, and a non-default port
      # is part of the origin, so K4 must move this value and the CSP
      # `connect-src`, MINIO_PUBLIC_ENDPOINT and /etc/hosts together (§8.1).
      #
      # THE :9443 IS NOT COSMETIC. An HTTP origin includes the port, so with
      # the edge on 9443 the browser's Origin header is
      # `https://automail.local:9443` and MinIO would reject the preflight for
      # the port-less value. This is one of the four coupled values in §8.1;
      # all four carry :9443 in this overlay and none of them do in the base.
      - MINIO_CORS_ORIGIN=https://automail.local:9443
      # The host cloud-server SIGNS into the pre-signed upload URL -- what the
      # browser is told to PUT to, not what the server itself talks to. It has
      # to resolve outside the cluster, so `minio:9000` is wrong here by
      # construction. Same four-way coupling as above: this, the CORS origin,
      # the CSP connect-src and /etc/hosts move together or uploads fail with
      # no server-side error (§8.1). Carries the port for the same reason the
      # CORS origin does: the URL cloud-server signs must be one the browser
      # can actually reach, and SigV4 signs the Host header including the port.
      - MINIO_PUBLIC_ENDPOINT=blob.automail.local:9443
      - MINIO_PUBLIC_SECURE=true

patches:
  # PIN THE DATA TIER TO THE SERVER NODE.
  #
  # k3s's default StorageClass is `local-path`: node-local directories, bound
  # WaitForFirstConsumer. The PV that gets provisioned carries a nodeAffinity
  # to whichever node first ran the pod, permanently. Two consequences:
  #
  #   * good -- delete the pod and it reschedules onto that same node with its
  #     data intact (the K2 acceptance leans on exactly this);
  #   * bad  -- `kubectl drain` that node and the pod is `Pending` forever.
  #
  # K6 drains a node on purpose. Pinning the data tier to the k3d *server*
  # node makes the three agents freely drainable, which is the only way both
  # goals can be true at once. The label is k3s's own role label; a cloud
  # overlay with network-attached storage would delete this patch outright.
  - target:
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role.kubernetes.io/control-plane: "true"

  # EXPOSE THE INTERNAL mTLS LISTENER TO THE PRINTER, WHICH LIVES OUTSIDE THE
  # CLUSTER (plans/16-kubernetes.md §6). The base keeps this Service ClusterIP
  # because "how does the outside reach it" is environment-specific.
  #
  # 30843 is not a free choice: infra/k8s/k3d-cluster.yaml publishes host
  # 127.0.0.1:9843 → nodePort 30843, and k3d froze that mapping at cluster
  # creation. Changing this number means recreating the cluster (and losing
  # every PVC), so it is pinned in scripts/k8s/versions.env as MTLS_NODE_PORT
  # and quoted here rather than picked.
  #
  # The printer therefore dials wss://localhost:9843 — deliberately, because
  # the cloud-server cert's SANs are `DNS:cloud-server, DNS:localhost` and
  # services/printer/mtls.go sets no ServerName. A node IP or
  # host.docker.internal would fail verification. §6.1 option (a): keep the
  # existing PKI, choose the name that already verifies. K5 proves it.
  - target:
      kind: Service
      name: cloud-server-mtls
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30843

  # MAKE OBJECT STORAGE REACHABLE FROM THE PRINTER, WHICH LIVES OUTSIDE THE
  # CLUSTER (Goal K5, plans/16-kubernetes.md §6).
  #
  # The dispatch frame carries a pre-signed GET URL, and cloud-server signs it
  # with its INTERNAL MinIO client — so its host is `minio:9000`. SigV4 signs
  # the Host header, port included, so the printer cannot be redirected to some
  # other address: whatever it dials must answer to the name `minio` on port
  # 9000. Three ways to give an outside process that, and only one works here:
  #
  #   * a NodePort — impossible, the range is 30000–32767 and the port is
  #     baked into the signature;
  #   * a k3d host port mapping — impossible without recreating the cluster
  #     (and every PVC with it), since k3d freezes them at creation time;
  #   * a hostPort — binds inside the k3d NODE container, whose IP is routable
  #     from this host because k3d nodes are Docker containers on a bridge.
  #
  # So the printer maps the name `minio` to the node IP MinIO landed on
  # (`kubectl get pod minio-0 -o jsonpath='{.status.hostIP}'`, wired into
  # docker-compose.k8s-printer.yml by scripts/k8s/e2e.sh) and the signature
  # verifies unchanged.
  #
  # WHY NOT `kubectl port-forward` ON THE HOST: 9000 on the host is not ours to
  # take. docker-compose.e2e.yml and docker-compose.full.yml publish the
  # *Compose* MinIO on 0.0.0.0:9000, so a forward would either fail to bind or,
  # worse, silently point the printer at the wrong object store and 404 on
  # every blob. Binding inside the node container sidesteps the host's port
  # space entirely, which is what keeps both stacks up at once (Process Rule 3).
  #
  # This is an overlay-only affordance. It is safe *because* the data tier is
  # pinned to one node above (a hostPort is a per-node exclusive resource, so
  # it would cap replicas at one per node otherwise), and it is exactly the
  # kind of local-host detail a proxmox overlay would drop.
  - target:
      kind: StatefulSet
      name: minio
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/ports/0/hostPort
        value: 9000

  # THE FOURTH COUPLED VALUE (§8.1): the CSP's connect-src.
  #
  # A CSP host-source without a port means the scheme's DEFAULT port, so
  # `https://blob.automail.local` does NOT permit a fetch to
  # `https://blob.automail.local:9443` — the browser blocks the guest's
  # ciphertext PUT with a console violation and no server-side error anywhere.
  # This is the single most confusing failure in the whole port cascade, which
  # is why the acceptance for this goal includes "no CSP violations in the
  # console" rather than only "the flow worked".
  - target:
      kind: Middleware
      name: secure-headers
    patch: |-
      - op: replace
        path: /spec/headers/contentSecurityPolicy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          connect-src 'self' https://blob.automail.local:9443
