# Environment-independent base for the Automail stateless tier.
# Layout and ownership: plans/16-kubernetes.md §3.
#
# Populated so far:
#   K2  data/{postgres,redis,minio}-{statefulset,service}.yaml
#   K3  cloud-server/{deployment,service,service-mtls,pdb}.yaml
#   K4  portal/{deployment,service}.yaml, ingress/*  ← this goal
# Still to come:
#   K7  cloud-server/hpa.yaml
#
# TWO THINGS ARE DELIBERATELY ABSENT FROM THIS TREE, AND ALWAYS WILL BE:
#
#  1. Secrets. They are created imperatively from infra/certs/ and .env by
#     `make k8s-secrets` (scripts/k8s/secrets.sh), so no PEM or password can
#     ever reach a committed manifest and gitleaks stays authoritative.
#     Manifests reference them by name only.
#  2. The `postgres-schema` ConfigMap. Its content is
#     services/cloud/db/schema.sql, which lives outside this Kustomize root --
#     Kustomize refuses to read files above its own directory, and a copy here
#     would be a second source of truth that drifts from the Compose path.
#     `scripts/k8s/apply.sh` creates it from the canonical file.
#
# The Namespace object is likewise not here: `scripts/k8s/secrets.sh` creates
# it before anything can be applied into it (a Secret cannot land in a
# namespace that does not exist yet), so declaring it again would be a second
# owner of the same object.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# `labels`, not the deprecated `commonLabels`. includeSelectors stays false on
# purpose: a Deployment's (and StatefulSet's) .spec.selector is immutable after
# creation, so a label that leaks into selectors can only be changed by
# deleting the object.
labels:
  - pairs:
      app.kubernetes.io/part-of: automail
    includeSelectors: false

resources:
  - data/postgres-statefulset.yaml
  - data/postgres-service.yaml
  - data/redis-statefulset.yaml
  - data/redis-service.yaml
  - data/minio-statefulset.yaml
  - data/minio-service.yaml
  - cloud-server/deployment.yaml
  - cloud-server/service.yaml
  - cloud-server/service-mtls.yaml
  - cloud-server/pdb.yaml
  - portal/deployment.yaml
  - portal/service.yaml
  - ingress/tlsoption.yaml
  - ingress/middlewares.yaml
  - ingress/ingressroutes.yaml
