# MinIO — StatefulSet, 1 replica (Goal K2 / plans/16-kubernetes.md §3, §5).
#
# MinIO stores the ciphertext blobs the browser PUTs to a pre-signed URL, so
# the cloud server never receives document bytes (plans/09-api-contracts.md).
# It is the one data-tier component that is *browser-facing*, which is why K4
# gives it its own hostname (blob.automail.local) instead of an internal-only
# Service. Single replica, single volume -- not erasure-coded, not HA.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: object-storage
    spec:
      containers:
        - name: minio
          # DO NOT BUMP TO :latest OR A BARE RELEASE TAG. Since
          # RELEASE.2023-11-01, MinIO's default image is RHEL9/UBI9-based and
          # its glibc hard-requires the x86-64-v2 microarch baseline. The
          # Proxmox target's CPU (AMD A6-3600 "Llano", 2011) predates it, so
          # the default image dies on boot with `Fatal glibc error: CPU does
          # not support x86-64-v2` -- and cloud-server depends on MinIO, so
          # that one crash takes the stack down. The `-cpuv1` image is the SAME
          # MinIO built on a v1 base (minio/minio #18365). Identical pin to
          # docker-compose.yml; changing one without the other is a bug.
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: automail-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: automail-credentials
                  key: MINIO_ROOT_PASSWORD
            # SSE-S3 default encryption via a static single-key KMS -- the
            # at-rest layer *under* the browser's E2EE, not a replacement for
            # it (docs/study/04-minio-sse-s3-vs-e2ee.md).
            - name: MINIO_KMS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: automail-credentials
                  key: MINIO_KMS_SECRET_KEY
            # The guest's ciphertext PUT is cross-origin (portal origin ->
            # blob origin), so MinIO answers the CORS preflight itself. The
            # value is environment-shaped (the edge port cascade in
            # plans/16-kubernetes.md §8.1 is K4's problem), hence a ConfigMap
            # in the overlay rather than a literal here.
            - name: MINIO_API_CORS_ALLOW_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: automail-config
                  key: MINIO_CORS_ORIGIN
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
