# portal — ClusterIP Service (Goal K4).
# Traefik's IngressRoute targets this by name; nothing outside the cluster
# reaches the pods except through the edge.
apiVersion: v1
kind: Service
metadata:
  name: portal
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: http
      port: 3000
      targetPort: http
